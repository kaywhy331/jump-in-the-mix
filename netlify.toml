[build]
  command = "npm run db:generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."jump-worker-schedule"]
  schedule = "* * * * *"

# The recovery-boundary probe bundles only the hold read; pg is copied as-is because its
# optional native binding is not resolvable by the bundler.
[functions."recovery-boundary"]
  external_node_modules = ["pg"]
