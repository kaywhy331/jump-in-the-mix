name: Private pilot feedback
description: Report friction without including private Contact or relationship information.
title: "[Pilot feedback] "
labels: ["pilot-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include names, phone numbers, email addresses, relationship notes, screenshots with private data, credentials, exports, databases, or backups in this public issue.
        For security issues, use the Security tab's private vulnerability-reporting option when available. For product feedback that cannot be sanitized, ask the pilot coordinator for the private reporting channel.
  - type: textarea
    id: task
    attributes:
      label: Task attempted
      description: Describe the goal using invented or redacted data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: steps
    attributes:
      label: Number of taps or steps
      placeholder: "Example: 7"
  - type: textarea
    id: terminology
    attributes:
      label: Confusing terminology or lost context
      description: Note words that were unclear and whether search, filters, page, or scroll position was lost.
  - type: textarea
    id: search
    attributes:
      label: Search terms and outcome
      description: Use invented terms. Say whether the Contact or action was found.
  - type: input
    id: device
    attributes:
      label: Device and operating system
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocks the task or risks data/security
        - Major workflow break
        - Repeated friction or accessibility issue
        - Minor visual or wording issue
    validations:
      required: true
  - type: dropdown
    id: screenshot_permission
    attributes:
      label: Sanitized screenshot permission
      description: Never upload a screenshot until all private information is removed.
      options:
        - No screenshot
        - May attach a fully sanitized screenshot
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all sensitive Contact, relationship, credential, export, database, and backup information.
          required: true
