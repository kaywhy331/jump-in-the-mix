name: One-time stale Google sync guard

on:
  push:
    branches: [agent/prd-core-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prd-core-foundation
          fetch-depth: 0
      - name: Prevent stale sync completion from overwriting a changed connection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/google-sync-service.ts')
          text = path.read_text()
          old_success = '''    await prisma.$transaction([
              prisma.integrationConnection.update({
                where: { id: connection.id },
                data: {
                  status: "ACTIVE",
                  syncCursor: planned.response.nextSyncToken ?? connection.syncCursor,
                  lastSyncAt: new Date(),
                  nextSyncAt,
                  lastError: errorSummary(errors),
                  metadata: {
                    ...existingMetadata,
                    selectedGroupResourceNames: config.selectedGroupResourceNames,
                    selectedGroupLabels: config.selectedGroupLabels,
                    autoMergeExact: config.autoMergeExact,
                    lastSummary: summary
                  } as Prisma.InputJsonValue
                }
              }),
              prisma.syncRun.update({
                where: { id: input.syncRunId },
                data: {
                  status: failed ? "COMPLETED_WITH_ERRORS" : "COMPLETED",
                  completedAt: new Date(),
                  createdCount: created,
                  updatedCount: updated,
                  skippedCount: skipped,
                  errorCount: failed,
                  errorSummary: errorSummary(errors)
                }
              })
            ]);'''.replace('            ', '')
          new_success = '''    await prisma.$transaction(async (tx) => {
              const connectionUpdate = await tx.integrationConnection.updateMany({
                where: {
                  id: connection.id,
                  status: { not: "REVOKED" },
                  externalAccountId: connection.externalAccountId,
                  credentialsCiphertext: connection.credentialsCiphertext
                },
                data: {
                  status: "ACTIVE",
                  syncCursor: planned.response.nextSyncToken ?? connection.syncCursor,
                  lastSyncAt: new Date(),
                  nextSyncAt,
                  lastError: errorSummary(errors),
                  metadata: {
                    ...existingMetadata,
                    selectedGroupResourceNames: config.selectedGroupResourceNames,
                    selectedGroupLabels: config.selectedGroupLabels,
                    autoMergeExact: config.autoMergeExact,
                    lastSummary: summary
                  } as Prisma.InputJsonValue
                }
              });
              await tx.syncRun.update({
                where: { id: input.syncRunId },
                data: {
                  status: connectionUpdate.count
                    ? failed ? "COMPLETED_WITH_ERRORS" : "COMPLETED"
                    : "CANCELED",
                  completedAt: new Date(),
                  createdCount: created,
                  updatedCount: updated,
                  skippedCount: skipped,
                  errorCount: failed,
                  errorSummary: connectionUpdate.count
                    ? errorSummary(errors)
                    : "The Google connection changed while this sync was running."
                }
              });
            });'''.replace('            ', '')
          old_error = '        where: { id: connection.id, status: { not: "REVOKED" } },'
          new_error = '''        where: {
                  id: connection.id,
                  status: { not: "REVOKED" },
                  externalAccountId: connection.externalAccountId,
                  credentialsCiphertext: connection.credentialsCiphertext
                },'''.replace('                ', '')
          if old_success not in text:
              raise SystemExit('Expected successful Google connection update block was not found.')
          text = text.replace(old_success, new_success, 1)
          if old_error not in text:
              raise SystemExit('Expected failed Google connection update guard was not found.')
          text = text.replace(old_error, new_error, 1)
          path.write_text(text)
          PY
      - name: Commit stale-sync guard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/google-sync-service.ts
          git commit -m "fix: prevent stale Google sync state overwrite"
          git push origin HEAD:agent/prd-core-foundation
