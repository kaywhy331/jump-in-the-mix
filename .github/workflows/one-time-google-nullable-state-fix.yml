name: One-time nullable Google state correction

on:
  push:
    branches: [agent/prd-core-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prd-core-foundation
          fetch-depth: 0
      - name: Guard nullable legacy OAuth state data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/google-contacts.ts')
          text = path.read_text()
          old = '''  if (claimed.count !== 1) throw new Error("The Google connection request was already completed.");
            try {
              const payload = decryptIntegrationCredentials<{ returnTo?: string; codeVerifier?: string }>(row.returnTo);
              return {
                returnTo: normalizedReturnTo(payload.returnTo),
                codeVerifier: payload.codeVerifier?.trim() || null
              };
            } catch {
              return { returnTo: normalizedReturnTo(row.returnTo), codeVerifier: null };
            }'''.replace('            ', '')
          new = '''  if (claimed.count !== 1) throw new Error("The Google connection request was already completed.");
            const storedState = row.returnTo;
            if (!storedState) return { returnTo: "/account", codeVerifier: null };
            try {
              const payload = decryptIntegrationCredentials<{ returnTo?: string; codeVerifier?: string }>(storedState);
              return {
                returnTo: normalizedReturnTo(payload.returnTo),
                codeVerifier: payload.codeVerifier?.trim() || null
              };
            } catch {
              return { returnTo: normalizedReturnTo(storedState), codeVerifier: null };
            }'''.replace('            ', '')
          if old not in text:
              raise SystemExit('Expected OAuth-state compatibility block was not found.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/google-contacts.ts
          git commit -m "fix: guard nullable legacy Google OAuth state"
          git push origin HEAD:agent/prd-core-foundation
