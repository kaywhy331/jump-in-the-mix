name: Rehearsal operations

# BUILD ONLY. Kevin creates and verifies the protected rehearsal environment first.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Reviewed rehearsal operation
        type: choice
        options: [probe, seed]
        required: true
      settings_json:
        description: Reviewed rehearsal settings JSON (identifiers only, no secrets)
        type: string
        required: true

permissions: {}
concurrency:
  group: rehearsal-release-and-recovery
  cancel-in-progress: false

jobs:
  rehearsal:
    if: startsWith(github.ref, 'refs/tags/rehearsal-releaser-')
    environment: rehearsal
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Public source archive: no checkout token and no credential persistence.
      - name: Read the immutable owner tag source
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 "https://codeload.github.com/$REPOSITORY/tar.gz/$SOURCE_SHA" -o "$RUNNER_TEMP/rehearsal-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/rehearsal-source.tar.gz" --strip-components=1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          token: ''
      - name: Run reviewed rehearsal operation
        env:
          MODE: ${{ inputs.mode }}
          REHEARSAL_SETTINGS_JSON: ${{ inputs.settings_json }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          case "$MODE" in
            probe) node scripts/release/rehearsal/probe.mjs ;;
            seed) node scripts/release/rehearsal/seed.mjs ;;
            *) exit 1 ;;
          esac
