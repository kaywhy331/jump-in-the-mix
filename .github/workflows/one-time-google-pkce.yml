name: One-time Google OAuth PKCE hardening

on:
  push:
    branches: [agent/prd-core-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prd-core-foundation
          fetch-depth: 0
      - name: Add PKCE to Google OAuth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/google-contacts.ts')
          text = path.read_text()
          old_create = '''  const state = randomBytes(32).toString("base64url");
            const expiresAt = new Date(Date.now() + 10 * 60 * 1000);'''.replace('            ', '')
          new_create = '''  const state = randomBytes(32).toString("base64url");
            const codeVerifier = randomBytes(64).toString("base64url");
            const codeChallenge = createHash("sha256").update(codeVerifier, "utf8").digest("base64url");
            const expiresAt = new Date(Date.now() + 10 * 60 * 1000);'''.replace('            ', '')
          old_state = '        returnTo: normalizedReturnTo(input.returnTo),'
          new_state = '        returnTo: encryptIntegrationCredentials({ returnTo: normalizedReturnTo(input.returnTo), codeVerifier }),' 
          old_params = '''  url.searchParams.set("prompt", "consent select_account");
            url.searchParams.set("state", state);'''.replace('            ', '')
          new_params = '''  url.searchParams.set("prompt", "consent select_account");
            url.searchParams.set("state", state);
            url.searchParams.set("code_challenge", codeChallenge);
            url.searchParams.set("code_challenge_method", "S256");'''.replace('            ', '')
          old_consume = '''export async function consumeGoogleOAuthState(workspaceId: string, state: string): Promise<{ returnTo: string }> {
            const tokenHash = hashToken(state);
            const row = await prisma.oAuthState.findFirst({
              where: {
                workspaceId,
                provider: GOOGLE_CONTACTS_PROVIDER,
                tokenHash,
                usedAt: null,
                expiresAt: { gt: new Date() }
              },
              select: { id: true, returnTo: true }
            });
            if (!row) throw new Error("The Google connection request expired or was already used.");
            const claimed = await prisma.oAuthState.updateMany({
              where: { id: row.id, usedAt: null, expiresAt: { gt: new Date() } },
              data: { usedAt: new Date() }
            });
            if (claimed.count !== 1) throw new Error("The Google connection request was already completed.");
            return { returnTo: normalizedReturnTo(row.returnTo) };
          }'''.replace('            ', '')
          new_consume = '''export async function consumeGoogleOAuthState(
            workspaceId: string,
            state: string
          ): Promise<{ returnTo: string; codeVerifier: string | null }> {
            const tokenHash = hashToken(state);
            const row = await prisma.oAuthState.findFirst({
              where: {
                workspaceId,
                provider: GOOGLE_CONTACTS_PROVIDER,
                tokenHash,
                usedAt: null,
                expiresAt: { gt: new Date() }
              },
              select: { id: true, returnTo: true }
            });
            if (!row) throw new Error("The Google connection request expired or was already used.");
            const claimed = await prisma.oAuthState.updateMany({
              where: { id: row.id, usedAt: null, expiresAt: { gt: new Date() } },
              data: { usedAt: new Date() }
            });
            if (claimed.count !== 1) throw new Error("The Google connection request was already completed.");
            try {
              const payload = decryptIntegrationCredentials<{ returnTo?: string; codeVerifier?: string }>(row.returnTo);
              return {
                returnTo: normalizedReturnTo(payload.returnTo),
                codeVerifier: payload.codeVerifier?.trim() || null
              };
            } catch {
              return { returnTo: normalizedReturnTo(row.returnTo), codeVerifier: null };
            }
          }'''.replace('            ', '')
          old_exchange = '''export async function exchangeGoogleAuthorizationCode(
            code: string,
            existingRefreshToken?: string | null
          ): Promise<GoogleCredentials> {
            const payload = await tokenRequest({
              code,
              client_id: env.googleClientId,
              client_secret: env.googleClientSecret,
              redirect_uri: env.googleRedirectUri,
              grant_type: "authorization_code"
            });'''.replace('            ', '')
          new_exchange = '''export async function exchangeGoogleAuthorizationCode(
            code: string,
            existingRefreshToken?: string | null,
            codeVerifier?: string | null
          ): Promise<GoogleCredentials> {
            const parameters: Record<string, string> = {
              code,
              client_id: env.googleClientId,
              client_secret: env.googleClientSecret,
              redirect_uri: env.googleRedirectUri,
              grant_type: "authorization_code"
            };
            if (codeVerifier) parameters.code_verifier = codeVerifier;
            const payload = await tokenRequest(parameters);'''.replace('            ', '')
          replacements = [
              (old_create, new_create),
              (old_state, new_state),
              (old_params, new_params),
              (old_consume, new_consume),
              (old_exchange, new_exchange),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected Google OAuth block was not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit PKCE hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/google-contacts.ts
          git commit -m "security: bind Google OAuth codes with PKCE"
          git push origin HEAD:agent/prd-core-foundation
