name: One-time Google date type correction

on:
  push:
    branches: [agent/prd-core-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prd-core-foundation
          fetch-depth: 0
      - name: Accept Prisma string or Date values in the dedupe key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/google-sync-service.ts')
          text = path.read_text()
          old = '''function jumpDateKey(value: {
            dateTypeId: string;
            label: string | null;
            dateValue: Date | null;
            month: number | null;
            day: number | null;
            recurrence: string;
          }): string {
            return [
              value.dateTypeId,
              normalizedImportText(value.label ?? ""),
              value.dateValue?.toISOString().slice(0, 10) ?? "",
              value.month ?? "",
              value.day ?? "",
              value.recurrence
            ].join("|");
          }'''.replace('          ', '')
          new = '''function jumpDateKey(value: {
            dateTypeId: string;
            label: string | null;
            dateValue: Date | string | null;
            month: number | null;
            day: number | null;
            recurrence: string;
          }): string {
            const logicalDate = value.dateValue instanceof Date
              ? value.dateValue.toISOString().slice(0, 10)
              : value.dateValue?.slice(0, 10) ?? "";
            return [
              value.dateTypeId,
              normalizedImportText(value.label ?? ""),
              logicalDate,
              value.month ?? "",
              value.day ?? "",
              value.recurrence
            ].join("|");
          }'''.replace('          ', '')
          if old not in text:
              raise SystemExit('Expected Jump Date key helper was not found.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/google-sync-service.ts
          git commit -m "fix: accept Prisma string dates in Google dedupe keys"
          git push origin HEAD:agent/prd-core-foundation
