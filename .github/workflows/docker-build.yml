name: Docker build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain --target production --tag jump-in-the-mix:ci . 2>&1 | tee docker-build.log
      - name: Upload Docker build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-diagnostics
          path: docker-build.log
          retention-days: 7
      - name: Inspect production image
        run: |
          docker image inspect jump-in-the-mix:ci --format '{{.Id}} {{.Size}} {{.Config.User}}'
          test "$(docker image inspect jump-in-the-mix:ci --format '{{.Config.User}}')" = "node"
