name: Docker build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain --target production --tag jump-in-the-mix:ci . 2>&1 | tee docker-build.log
      - name: Inspect production image
        run: |
          docker image inspect jump-in-the-mix:ci --format '{{.Id}} {{.Size}} {{.Config.User}}'
          test "$(docker image inspect jump-in-the-mix:ci --format '{{.Config.User}}')" = "node"
      - name: Build worker image
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain --target worker --tag jump-in-the-mix-worker:ci . 2>&1 | tee docker-worker-build.log
      - name: Inspect worker image
        run: |
          docker image inspect jump-in-the-mix-worker:ci --format '{{.Id}} {{.Size}} {{.Config.User}}'
          test "$(docker image inspect jump-in-the-mix-worker:ci --format '{{.Config.User}}')" = "node"
      - name: Upload Docker build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-diagnostics
          path: |
            docker-build.log
            docker-worker-build.log
          if-no-files-found: ignore
          retention-days: 7

  backup-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build scheduled backup image
        run: docker build --file infra/operations/backup.Dockerfile --tag jump-in-the-mix-backup:ci .
      - name: Verify backup runtime tools and imports
        run: |
          test "$(docker image inspect jump-in-the-mix-backup:ci --format '{{.Config.User}}')" = "node"
          docker run --rm --entrypoint pg_dump jump-in-the-mix-backup:ci --version
          docker run --rm --entrypoint aws jump-in-the-mix-backup:ci --version
          docker run --rm --entrypoint node jump-in-the-mix-backup:ci --input-type=module -e 'await import("./scripts/lib/s3-backup-store.mjs"); await import("./scripts/lib/recovery-bundle.mjs");'
